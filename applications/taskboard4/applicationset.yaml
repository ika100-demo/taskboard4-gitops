apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: taskboard4-dev
  namespace: argocd
spec:
  generators:
  - list:
      elements:
      - name: taskboard4-api
      - name: taskboard4-web
  template:
    metadata:
      name: '{{name}}-dev'
    spec:
      project: default
      source:
        repoURL: https://github.com/ika100-demo/taskboard4-gitops
        targetRevision: main
        path: applications/taskboard4/overlays/dev/{{name}}
      destination:
        server: https://kubernetes.default.svc
        namespace: taskboard4-dev
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        - CreateNamespace=true
---
